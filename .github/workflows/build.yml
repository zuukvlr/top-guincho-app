name: Build APK e publicar release

# A cada push na main: compila o APK assinado e publica uma Release.
# O app instalado consulta a última Release e oferece "Atualização nova".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Teste automático do app (navegador headless)
        working-directory: tests
        run: |
          npm install
          npx playwright install --with-deps chromium
          node smoke.mjs

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Restaurar keystore
        run: printf %s "${{ secrets.KEYSTORE_B64 }}" | tr -d "[:space:]" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compilar
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk TopGuincho.apk
          gh release create "v1.0.${{ github.run_number }}" TopGuincho.apk \
            --title "TOP Guincho 1.0.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s)"
